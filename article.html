<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Neptuno | Noticia</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                <a href="index.html">RADIO <span>NEPTUNO</span></a>
            </div>
            <nav class="main-nav" id="mainNav">
                <ul>
                    <li><a href="index.html">Radio</a></li>
                    <li><a href="index.html#programacion">Programa</a></li>
                    <li><a href="index.html#noticias" class="active">Noticias</a></li>
                    <li><a href="index.html#productos">Productos</a></li>
                </ul>
            </nav>
            <div class="social-header">
                <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://youtube.com" target="_blank"><i class="fab fa-youtube"></i></a>
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </header>

    <main>
        <section id="article-content" class="section-container" style="padding: 60px 20px;">
            <div id="article-root">
                <p>Cargando artículo...</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-brand">
                <h3>RADIO NEPTUNO</h3>
                <p>Corriente continua, Cobertura total.</p>
            </div>
            <div class="footer-links">
                <h4>Navegación</h4>
                <ul>
                    <li><a href="index.html">Radio</a></li>
                    <li><a href="index.html#programacion">Programa</a></li>
                    <li><a href="index.html#noticias">Noticias</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Radio Neptuno. Hecho con ❤️ para la comunidad.</p>
        </div>
    </footer>

    <script>
        async function loadArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = parseInt(urlParams.get('id')) || 1;

            try {
                const response = await fetch('noticias.json');
                const data = await response.json();
                const article = data.find(item => item.id === articleId);
                const nextArticle = data.find(item => item.id === articleId + 1);

                if (article) {
                    document.getElementById('article-root').innerHTML = `
                        <nav class="breadcrumb" style="margin-bottom:20px; color:var(--text-muted);">
                            <a href="index.html" style="color:var(--primary-color); text-decoration:none;">← Volver al inicio</a>
                        </nav>
                        <img src="${article.imagen}" style="width:100%; border-radius:8px; margin-bottom:20px;">
                        <h1 style="color:var(--primary-color);">${article.titulo}</h1>
                        <div class="article-body" style="line-height:1.8; margin: 20px 0;">${article.cuerpo}</div>
                        
                        <div class="share-block" style="border-top:2px solid var(--accent-color); padding-top:20px; margin-top:40px;">
                            <p>Compartir:</p>
                            <a href="https://twitter.com/intent/tweet?text=${article.titulo}" class="btn-secondary" target="_blank">Twitter</a>
                            <a href="https://wa.me/?text=${article.titulo} ${window.location.href}" class="btn-secondary" target="_blank">WhatsApp</a>
                        </div>
                        
                        ${nextArticle ? `<div class="next-article" style="margin-top:30px; text-align:right;">
                            <a href="articulo.html?id=${nextArticle.id}" style="color:var(--accent-color); font-weight:bold;">Siguiente: ${nextArticle.titulo} →</a>
                        </div>` : ''}
                    `;
                }
            } catch (err) {
                document.getElementById('article-root').innerHTML = "<p>No se pudo cargar la noticia.</p>";
            }
        }
        loadArticle();
    </script>
</body>
</html>
