<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Cooperativa - Reproductor En Vivo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-blue: #16428c;
            --bg-blue-dark: #0d2e6c;
            --bg-panel: #2358b1;
            --bg-panel-dark: #1b4899;
            --border-blue: #3b72cf;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-blue);
            color: #ffffff;
        }
        /* Custom scrollbar for left panel history */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <header class="w-full bg-[#0d2e6c] py-3 px-4 md:px-8 border-b border-[#1b4f9c] flex justify-between items-center shadow-md">
        <!-- Logo Cooperativa -->
        <div class="flex items-center space-x-3">
            <div class="text-white font-black text-2xl tracking-tighter italic flex items-center select-none">
                cooperativa
                <span class="w-2.5 h-2.5 bg-red-500 rounded-full ml-0.5 mb-2"></span>
            </div>
            <span class="hidden sm:inline-block text-xs uppercase bg-blue-900/60 text-blue-200 px-2 py-0.5 rounded border border-blue-500/30">
                En Vivo
            </span>
        </div>

        <!-- Social Icons -->
        <div class="flex items-center space-x-3">
            <a href="https://facebook.com" target="_blank" rel="noopener" aria-label="Facebook" class="w-8 h-8 rounded-full bg-[#1852a3] hover:bg-[#2563eb] flex items-center justify-center text-white transition-colors">
                <i class="fab fa-facebook-f text-sm"></i>
            </a>
            <a href="https://twitter.com" target="_blank" rel="noopener" aria-label="Twitter" class="w-8 h-8 rounded-full bg-[#1852a3] hover:bg-[#2563eb] flex items-center justify-center text-white transition-colors">
                <i class="fab fa-twitter text-sm"></i>
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram" class="w-8 h-8 rounded-full bg-[#1852a3] hover:bg-[#2563eb] flex items-center justify-center text-white transition-colors">
                <i class="fab fa-instagram text-sm"></i>
            </a>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- LEFT COLUMN: Live Metadata History Log -->
        <section class="lg:col-span-6 bg-[#2358b1] rounded-lg shadow-xl border border-[#3b72cf] flex flex-col h-[580px] overflow-hidden">
            
            <!-- Panel Toolbar -->
            <div class="bg-[#1b4899] px-4 py-3 flex justify-between items-center border-b border-[#2e68ce]">
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span class="text-xs uppercase font-bold tracking-wider text-slate-100">Historial en Vivo</span>
                </div>
                <div class="text-[11px] uppercase tracking-wider text-blue-200" id="last-update-tag">
                    Sincronizando Zeno.fm...
                </div>
            </div>

            <!-- Date/Status Bar -->
            <div class="bg-[#2052a6] px-4 py-2 flex justify-between items-center text-xs font-medium border-b border-[#3067c2] text-blue-100">
                <span id="current-date-display" class="font-bold tracking-wide">
                    Cargando fecha...
                </span>
                <span class="text-[11px] bg-[#16428c] px-2 py-0.5 rounded border border-blue-400/30">
                    Transmisión Continua
                </span>
            </div>

            <!-- Dynamic Track History Container -->
            <div id="history-list" class="flex-1 overflow-y-auto p-3 space-y-2">
                <!-- Program/Song items inserted dynamically -->
            </div>
        </section>

        <!-- RIGHT COLUMN: Active Player with Live Cover Art & Stream Controls -->
        <section class="lg:col-span-6 flex flex-col space-y-6">
            
            <!-- Player Card -->
            <div class="bg-[#2358b1] border border-[#3b72cf] rounded-xl p-5 shadow-2xl relative">
                
                <div class="flex flex-col sm:flex-row items-center gap-5">
                    
                    <!-- Cover Art Container -->
                    <div class="relative w-44 h-44 sm:w-48 sm:h-48 shrink-0 rounded-xl overflow-hidden shadow-2xl bg-[#0d2857] border-2 border-blue-400/30 group">
                        <img id="player-cover-art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80" alt="Carátula" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                        
                        <!-- Badge sobre la carátula -->
                        <div class="absolute bottom-2 left-2 right-2 flex justify-between items-center">
                            <span class="text-[10px] font-bold uppercase tracking-widest bg-blue-600/80 backdrop-blur-md px-2 py-0.5 rounded text-white shadow">
                                En Vivo
                            </span>
                        </div>
                    </div>

                    <!-- Song Info & Player Controls -->
                    <div class="flex-1 w-full flex flex-col justify-between space-y-4 text-center sm:text-left">
                        
                        <div>
                            <!-- Audio Status Badge -->
                            <div class="inline-flex items-center bg-[#16428c] text-blue-200 text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full mb-2 shadow-sm border border-blue-500/30">
                                <span id="player-status-badge" class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block mr-1.5 animate-pulse"></span>
                                <span id="player-status-text">Listo para reproducir</span>
                            </div>

                            <!-- Live Track Title & Artist -->
                            <h2 id="player-track-title" class="text-lg sm:text-xl font-bold text-white tracking-tight leading-snug line-clamp-2">
                                Radio Cooperativa
                            </h2>
                            <p id="player-track-artist" class="text-sm font-medium text-blue-200 mt-1 line-clamp-1">
                                Transmisión Oficial
                            </p>
                        </div>

                        <!-- Audio Control Toolbar -->
                        <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-blue-400/20">
                            
                            <!-- Volume Controls -->
                            <div class="flex items-center space-x-2 bg-[#16428c]/60 px-3 py-1.5 rounded-lg border border-blue-400/20">
                                <button id="btn-mute" aria-label="Silenciar" class="text-blue-200 hover:text-white transition-colors">
                                    <i id="volume-icon" class="fas fa-volume-high text-sm"></i>
                                </button>
                                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-16 sm:w-20 accent-blue-400 cursor-pointer h-1.5 bg-blue-900 rounded-lg">
                            </div>

                            <!-- Big Play/Pause Button -->
                            <div class="flex items-center space-x-3">
                                <button id="btn-main-play" aria-label="Reproducir / Pausar" class="w-14 h-14 rounded-full bg-blue-500 hover:bg-blue-400 text-white flex items-center justify-center shadow-xl transition-all transform active:scale-95 border-2 border-white/20">
                                    <i id="main-play-icon" class="fas fa-play text-xl ml-1"></i>
                                </button>
                            </div>

                            <!-- Action Icons -->
                            <div class="flex items-center space-x-2 text-blue-200">
                                <button id="btn-share" title="Compartir Emisora" class="p-2 hover:bg-blue-700/50 rounded-lg hover:text-white transition-colors">
                                    <i class="fas fa-share-nodes text-sm"></i>
                                </button>
                                <button id="btn-info" title="Información de la Emisora" class="p-2 hover:bg-blue-700/50 rounded-lg hover:text-white transition-colors">
                                    <i class="fas fa-circle-info text-sm"></i>
                                </button>
                            </div>

                        </div>

                    </div>
                </div>

            </div>

        </section>

    </main>

    <!-- Hidden HTML5 Audio Element -->
    <audio id="audio-stream" preload="none"></audio>

    <!-- Modal para Notificaciones (reemplazo de alert) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#1b4899] border border-blue-400/30 rounded-xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 bg-blue-600/30 text-blue-300 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fas fa-radio"></i>
            </div>
            <h3 id="modal-title" class="text-lg font-bold text-white">Radio Cooperativa</h3>
            <p id="modal-message" class="text-sm text-blue-100">Mensaje del reproductor.</p>
            <button id="modal-close-btn" class="w-full py-2 bg-blue-500 hover:bg-blue-400 text-white rounded-lg font-semibold shadow transition-colors">
                Aceptar
            </button>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const CONFIG = {
            streamUrl: "https://stream.zeno.fm/lqnwrpclo7hvv",
            stationId: "lqnwrpclo7hvv",
            metaUrl: "https://api.zeno.fm/mounts/v2/snippet/lqnwrpclo7hvv",
            updateInterval: 15000, // 15 seconds
            defaultCover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80"
        };

        // STATE VARIABLES
        let isPlaying = false;
        let currentRawSong = "";
        let songHistory = [];

        // DOM ELEMENTS
        const audioElement = document.getElementById('audio-stream');
        audioElement.src = CONFIG.streamUrl;

        const btnMainPlay = document.getElementById('btn-main-play');
        const mainPlayIcon = document.getElementById('main-play-icon');
        const playerTrackTitle = document.getElementById('player-track-title');
        const playerTrackArtist = document.getElementById('player-track-artist');
        const playerCoverArt = document.getElementById('player-cover-art');
        const playerStatusBadge = document.getElementById('player-status-badge');
        const playerStatusText = document.getElementById('player-status-text');
        const volumeSlider = document.getElementById('volume-slider');
        const btnMute = document.getElementById('btn-mute');
        const volumeIcon = document.getElementById('volume-icon');
        const historyList = document.getElementById('history-list');
        const lastUpdateTag = document.getElementById('last-update-tag');
        const currentDateDisplay = document.getElementById('current-date-display');
        
        const customModal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        function togglePlayPause() {
            if (isPlaying) {
                audioElement.pause();
                isPlaying = false;
                mainPlayIcon.className = "fas fa-play text-xl ml-1";
                playerStatusBadge.className = "w-1.5 h-1.5 rounded-full bg-amber-400 inline-block mr-1.5";
                playerStatusText.textContent = "Pausado";
            } else {
                audioElement.play().then(() => {
                    isPlaying = true;
                    mainPlayIcon.className = "fas fa-pause text-xl";
                    playerStatusBadge.className = "w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block mr-1.5 animate-pulse";
                    playerStatusText.textContent = "Reproduciendo en Vivo";
                }).catch(err => {
                    showModal("Error de Reproducción", "No se pudo iniciar el audio automáticamente. Haz clic en reproducir nuevamente.");
                });
            }
        }

        btnMainPlay.addEventListener('click', togglePlayPause);

        // Volume control
        volumeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            audioElement.volume = val;
            audioElement.muted = (val === 0);
            updateVolumeIcon(val);
        });

        btnMute.addEventListener('click', () => {
            audioElement.muted = !audioElement.muted;
            if (audioElement.muted) {
                volumeIcon.className = "fas fa-volume-xmark text-sm text-red-400";
                volumeSlider.value = 0;
            } else {
                volumeSlider.value = audioElement.volume > 0 ? audioElement.volume : 0.8;
                audioElement.volume = volumeSlider.value;
                updateVolumeIcon(audioElement.volume);
            }
        });

        function updateVolumeIcon(val) {
            if (val === 0 || audioElement.muted) {
                volumeIcon.className = "fas fa-volume-xmark text-sm text-red-400";
            } else if (val < 0.5) {
                volumeIcon.className = "fas fa-volume-low text-sm";
            } else {
                volumeIcon.className = "fas fa-volume-high text-sm";
            }
        }

        async function fetchiTunesCover(artist, title) {
            try {
                const query = encodeURIComponent(`${artist} ${title}`.trim());
                if (!query) return CONFIG.defaultCover;

                const response = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                if (!response.ok) return CONFIG.defaultCover;

                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    const artwork100 = data.results[0].artworkUrl100;
                    // Upgrade artwork to 600x600 resolution
                    return artwork100.replace('100x100bb', '600x600bb');
                }
            } catch (err) {
                console.warn("Error buscando carátula en iTunes:", err);
            }
            return CONFIG.defaultCover;
        }

        async function fetchZenoMetadata() {
            try {
                // Cache-busting timestamp
                const res = await fetch(`${CONFIG.metaUrl}?_=${Date.now()}`);
                if (!res.ok) throw new Error("Error en servidor Zeno");

                const data = await res.json();
                let rawTitle = data.streamTitle || data.title || "";

                if (!rawTitle || rawTitle.trim() === "") {
                    rawTitle = "Radio Cooperativa - Transmisión en Vivo";
                }

                // If song changed
                if (rawTitle !== currentRawSong) {
                    currentRawSong = rawTitle;
                    await processNewTrack(rawTitle);
                }

                const now = new Date();
                lastUpdateTag.textContent = `Actualizado: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

            } catch (error) {
                console.warn("No se pudo obtener metadata de Zeno.fm:", error);
                lastUpdateTag.textContent = "Modo de emisión continua";
            }
        }

        // Process title & artist parsing
        async function processNewTrack(rawString) {
            let artist = "Radio Cooperativa";
            let title = rawString;

            // Common Zeno delimiter format: "Artist - Title"
            if (rawString.includes(" - ")) {
                const parts = rawString.split(" - ");
                artist = parts[0].trim();
                title = parts.slice(1).join(" - ").trim();
            }

            // Update main player text
            playerTrackTitle.textContent = title;
            playerTrackArtist.textContent = artist;

            // Fetch Artwork
            const coverUrl = await fetchiTunesCover(artist, title);
            playerCoverArt.src = coverUrl;

            // Push to history
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const trackObj = {
                id: Date.now(),
                artist: artist,
                title: title,
                time: `${timeStr} hrs`,
                cover: coverUrl
            };

            songHistory.unshift(trackObj);
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            songHistory.forEach((item, index) => {
                const isLatest = index === 0;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-2.5 rounded-lg transition-all ${isLatest ? 'bg-[#1b4899] border-l-4 border-blue-400 shadow-md' : 'bg-[#1d4c9e]/40 hover:bg-[#1d4c9e]'}`;

                div.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <img src="${item.cover}" alt="Cover" class="w-12 h-12 rounded object-cover shrink-0 border border-blue-400/20 shadow-sm">
                        <div class="truncate">
                            <h4 class="text-xs sm:text-sm font-semibold text-white truncate">${escapeHtml(item.title)}</h4>
                            <p class="text-[11px] text-blue-200 truncate">${escapeHtml(item.artist)}</p>
                            <span class="text-[10px] text-blue-300/80 font-mono">${item.time}</span>
                        </div>
                    </div>
                    <div class="shrink-0 ml-2">
                        ${isLatest ? '<span class="text-[10px] font-bold uppercase bg-blue-500/30 text-blue-200 px-2 py-0.5 rounded border border-blue-400/30">Sonando</span>' : ''}
                    </div>
                `;

                historyList.appendChild(div);
            });
        }

        // Helper escape HTML
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Modal helper
        function showModal(title, msg) {
            modalTitle.textContent = title;
            modalMessage.textContent = msg;
            customModal.classList.remove('hidden');
        }

        modalCloseBtn.addEventListener('click', () => {
            customModal.classList.add('hidden');
        });

        document.getElementById('btn-share').addEventListener('click', () => {
            showModal("Compartir", "Sintonizando Radio Cooperativa en Vivo: " + window.location.href);
        });

        document.getElementById('btn-info').addEventListener('click', () => {
            showModal("Radio Cooperativa", "Estación en vivo conectada a Zeno.fm con detección en tiempo real de títulos y carátulas de iTunes.");
        });

        // Update current date string
        function updateDateDisplay() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit' };
            currentDateDisplay.textContent = now.toLocaleDateString('es-CL', options).toUpperCase();
        }

        window.onload = function() {
            updateDateDisplay();
            
            // Initial fetch
            fetchZenoMetadata();

            // Set up 15-second update interval
            setInterval(fetchZenoMetadata, CONFIG.updateInterval);
        };
    </script>
</body>
</html>
